name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: main-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml # zizmor: ignore[self-repository]

  release:
    needs: [verify]
    permissions:
      contents: read
      id-token: write
    uses: uinaf/.github/.github/workflows/release-npm.yml@080140b744b6c6560df14ee787b84db2c486fa84 # v3.2.0
    secrets:
      UINAF_CI_APP_PRIVATE_KEY: ${{ secrets.UINAF_CI_APP_PRIVATE_KEY }}
