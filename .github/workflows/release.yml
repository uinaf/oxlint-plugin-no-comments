name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: main-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml # zizmor: ignore[self-repository]

  release:
    needs: [verify]
    permissions:
      contents: read
      id-token: write
    uses: uinaf/.github/.github/workflows/release-npm.yml@c932734eb0f1da0274276374e1227a9a368cacba # v3.4.0
    secrets:
      UINAF_CI_APP_PRIVATE_KEY: ${{ secrets.UINAF_CI_APP_PRIVATE_KEY }}
